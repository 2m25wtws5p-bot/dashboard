<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<style>

* { box-sizing: border-box; }

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #0e1012;
    color: #f2f2ef;
    overflow: hidden;
}

.dashboard {
    width: 100vw;
    height: 100vh;
    padding: 30px 46px;
    display: grid;
    grid-template-columns: 48% 52%;
    gap: 42px;
}


/* =========================
   ALLGEMEIN
   ========================= */

.section-title {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #d1d4d5;
}

.muted {
    color: #777d81;
}


/* =========================
   LINKS
   ========================= */

.left {
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.location {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #c9cdcf;
}

.time {
    font-size: 140px;
    line-height: .9;
    letter-spacing: -7px;
    font-weight: 700;
    margin-top: 14px;
    color: #fff;
}

.date {
    font-size: 27px;
    margin-top: 14px;
    color: #d7d9da;
}


/* =========================
   MONATSKALENDER
   ========================= */

.calendar-box {
    margin-top: 24px;
    border-top: 1px solid #3b4044;
    padding-top: 17px;
}

.calendar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.month-name {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.calendar-year {
    font-size: 17px;
    color: #858b8f;
}

.calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    row-gap: 6px;
    column-gap: 5px;
}

.weekday {
    font-size: 13px;
    font-weight: 700;
    color: #747a7e;
    padding-bottom: 3px;
}

.calendar-day {
    height: 30px;
    line-height: 30px;
    font-size: 17px;
    color: #d1d4d5;
}

.calendar-day.other {
    color: #484d51;
}

.calendar-day.today {
    width: 30px;
    height: 30px;
    line-height: 30px;
    margin: auto;
    border-radius: 50%;
    background: #f0f0ed;
    color: #101214;
    font-weight: 700;
}


/* =========================
   TERMINE
   ========================= */

.events {
    margin-top: 19px;
    border-top: 1px solid #3b4044;
    padding-top: 15px;
}

.events-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.events-source {
    font-size: 12px;
    color: #73797d;
}

.event-list {
    margin-top: 9px;
}

.event {
    display: grid;
    grid-template-columns: 80px 1fr;
    align-items: center;
    min-height: 34px;
    border-bottom: 1px solid #24282b;
}

.event-time {
    font-size: 14px;
    color: #8b9195;
}

.event-name {
    font-size: 16px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.event-placeholder {
    padding: 12px 0;
    font-size: 15px;
    color: #6f7579;
}


/* =========================
   RECHTS
   ========================= */

.right {
    border-left: 1px solid #4a4f53;
    padding-left: 42px;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.weather-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.weather-location {
    font-size: 12px;
    color: #777d81;
    letter-spacing: 1px;
}


/* =========================
   AKTUELLES WETTER
   ========================= */

.current-weather {
    padding: 21px 0 20px;
    display: grid;
    grid-template-columns: 130px 1fr;
    align-items: center;
}

.current-icon {
    width: 105px;
    height: 105px;
}

.current-temp {
    font-size: 94px;
    line-height: .9;
    font-weight: 700;
    color: #fff;
}

.current-condition {
    font-size: 23px;
    margin-top: 9px;
}

.current-sub {
    font-size: 15px;
    color: #8d9396;
    margin-top: 6px;
}


/* =========================
   WETTERWERTE
   ========================= */

.weather-details {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    padding: 17px 0;
    border-top: 1px solid #3b4044;
    border-bottom: 1px solid #3b4044;
}

.detail {
    text-align: center;
    border-right: 1px solid #292d30;
}

.detail:last-child {
    border-right: 0;
}

.detail-label {
    font-size: 11px;
    color: #747a7e;
    text-transform: uppercase;
    letter-spacing: .8px;
    margin-bottom: 6px;
}

.detail-value {
    font-size: 24px;
    font-weight: 700;
}


/* =========================
   SONNE
   ========================= */

.sun-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    padding: 15px 0;
    border-bottom: 1px solid #3b4044;
}

.sun-item {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
}

.sun-symbol {
    width: 35px;
    height: 35px;
}

.sun-label {
    font-size: 11px;
    color: #747a7e;
    text-transform: uppercase;
    letter-spacing: .8px;
}

.sun-time {
    font-size: 20px;
    font-weight: 700;
    margin-top: 2px;
}


/* =========================
   REGENVERLAUF
   ========================= */

.rain-section {
    padding: 16px 0 15px;
    border-bottom: 1px solid #3b4044;
}

.rain-title-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.rain-caption {
    font-size: 11px;
    color: #686e72;
}

.rain-timeline {
    height: 76px;
    margin-top: 10px;
    display: flex;
    align-items: flex-end;
    gap: 5px;
}

.rain-column {
    flex: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
}

.rain-value {
    font-size: 10px;
    color: #aeb2b4;
    margin-bottom: 3px;
}

.rain-bar-area {
    height: 35px;
    width: 100%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
}

.rain-bar {
    width: 55%;
    min-height: 1px;
    background: #b9bdbe;
    border-radius: 2px 2px 0 0;
}

.rain-hour {
    margin-top: 5px;
    font-size: 10px;
    color: #696f73;
}


/* =========================
   VORHERSAGE
   ========================= */

.forecast-title {
    margin-top: 17px;
}

.forecast {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    align-items: center;
    min-height: 150px;
}

.forecast-day {
    text-align: center;
}

.forecast-name {
    font-size: 16px;
    font-weight: 700;
    text-transform: uppercase;
}

.forecast-icon {
    width: 59px;
    height: 59px;
    margin: 10px auto;
}

.forecast-max {
    font-size: 24px;
    font-weight: 700;
}

.forecast-min {
    color: #858b8f;
    font-size: 14px;
    margin-top: 3px;
}

.forecast-rain {
    color: #a0a5a8;
    font-size: 12px;
    margin-top: 7px;
}

.updated {
    text-align: right;
    color: #4f5559;
    font-size: 10px;
}


/* =========================
   SVG
   ========================= */

.weather-svg {
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #e7e9e9;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.weather-svg .muted {
    stroke: #858b8f;
}

.weather-svg .rain {
    stroke: #b4b8ba;
}


/* =========================
   TABLET
   ========================= */

@media(max-width:1000px) {

    .dashboard {
        padding: 24px 29px;
        gap: 28px;
    }

    .time {
        font-size: 112px;
    }

    .right {
        padding-left: 28px;
    }

    .current-temp {
        font-size: 75px;
    }
}

</style>
</head>

<script>


/* =========================================
   UHR
   ========================================= */

function updateClock() {

    var now = new Date();

    document.getElementById("time").textContent =
        now.toLocaleTimeString(
            "de-DE",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    document.getElementById("date").textContent =
        now.toLocaleDateString(
            "de-DE",
            {
                weekday:"long",
                day:"numeric",
                month:"long",
                year:"numeric"
            }
        );
}

updateClock();

setInterval(updateClock,1000);



/* =========================================
   MONATSKALENDER
   ========================================= */

function buildCalendar() {

    var today = new Date();

    var year = today.getFullYear();

    var month = today.getMonth();

    var months = [
        "Januar",
        "Februar",
        "März",
        "April",
        "Mai",
        "Juni",
        "Juli",
        "August",
        "September",
        "Oktober",
        "November",
        "Dezember"
    ];

    document.getElementById("monthName").textContent =
        months[month];

    document.getElementById("calendarYear").textContent =
        year;

    var calendar =
        document.getElementById("calendar");

    calendar.innerHTML = "";

    var weekdays =
        ["MO","DI","MI","DO","FR","SA","SO"];

    for (var w=0; w<7; w++) {

        calendar.innerHTML +=
            '<div class="weekday">' +
            weekdays[w] +
            '</div>';
    }

    var first =
        new Date(year,month,1);

    var start =
        first.getDay();

    if (start === 0)
        start = 7;

    start--;

    var days =
        new Date(
            year,
            month+1,
            0
        ).getDate();

    var previous =
        new Date(
            year,
            month,
            0
        ).getDate();

    for (var p=start-1; p>=0; p--) {

        calendar.innerHTML +=
            '<div class="calendar-day other">' +
            (previous-p) +
            '</div>';
    }

    for (var d=1; d<=days; d++) {

        var css =
            "calendar-day";

        if (d === today.getDate())
            css += " today";

        calendar.innerHTML +=
            '<div class="' +
            css +
            '">' +
            d +
            '</div>';
    }

    var used =
        start + days;

    var remainder =
        used % 7;

    if (remainder !== 0) {

        var next =
            7 - remainder;

        for (var n=1; n<=next; n++) {

            calendar.innerHTML +=
                '<div class="calendar-day other">' +
                n +
                '</div>';
        }
    }
}

buildCalendar();

function weatherInfo(code) {

    if (code === 0)
        return [sunSVG(),"Klar"];

    if (code === 1)
        return [partlyCloudySVG(),"Überwiegend klar"];

    if (code === 2)
        return [partlyCloudySVG(),"Teilweise bewölkt"];

    if (code === 3)
        return [cloudSVG(),"Bewölkt"];

    if (code === 45 || code === 48)
        return [fogSVG(),"Nebel"];

    if ([51,53,55,56,57].indexOf(code) !== -1)
        return [rainSVG(),"Nieselregen"];

    if ([61,63,65,66,67,80,81,82].indexOf(code) !== -1)
        return [rainSVG(),"Regen"];

    if ([71,73,75,77,85,86].indexOf(code) !== -1)
        return [snowSVG(),"Schnee"];

    if ([95,96,99].indexOf(code) !== -1)
        return [stormSVG(),"Gewitter"];

    return [cloudSVG(),"Wetter"];
}



/* =========================================
   ZEIT HILFSFUNKTION
   ========================================= */

function shortTime(iso) {

    if (!iso)
        return "--:--";

    var parts =
        iso.split("T");

    if (parts.length < 2)
        return "--:--";

    return parts[1].substring(0,5);
}


function shortDay(dateString) {

    var date =
        new Date(
            dateString +
            "T12:00:00"
        );

    return date.toLocaleDateString(
        "de-DE",
        {
            weekday:"short"
        }
    );
}



/* =========================================
   REGEN TIMELINE
   ========================================= */

function buildRainTimeline(data) {

    var container =
        document.getElementById(
            "rainTimeline"
        );

    container.innerHTML = "";

    var today =
        new Date();

    var currentHour =
        today.getHours();

    /*
       Ab aktueller Stunde,
       dann jeweils +2 Stunden.
       Maximal bis Tagesende.
    */

    var indexes = [];

    for (
        var h=currentHour;
        h<24;
        h+=2
    ) {

        indexes.push(h);
    }

    /*
       Bei spätem Abend sind sonst
       zu wenige Werte sichtbar.

       Dann zeigen wir zusätzlich
       den frühen Morgen morgen.
    */

    if (indexes.length < 6) {

        var needed =
            6 - indexes.length;

        for (
            var n=0;
            n<needed;
            n++
        ) {

            indexes.push(
                24 + n*2
            );
        }
    }


    for (
        var i=0;
        i<indexes.length;
        i++
    ) {

        var index =
            indexes[i];

        if (
            index >=
            data.hourly.time.length
        )
            break;

        var probability =
            data.hourly
                .precipitation_probability[index];

        if (
            probability === null ||
            probability === undefined
        )
            probability = 0;


        var hour =
            data.hourly
                .time[index]
                .split("T")[1]
                .substring(0,2);


        var height =
            Math.max(
                2,
                probability * 0.35
            );


        container.innerHTML +=

        '<div class="rain-column">' +

            '<div class="rain-value">' +
            probability +
            '%</div>' +

            '<div class="rain-bar-area">' +

                '<div class="rain-bar" ' +
                'style="height:' +
                height +
                'px"></div>' +

            '</div>' +

            '<div class="rain-hour">' +
            hour +
            ' Uhr</div>' +

        '</div>';
    }
}



/* =========================================
   WETTER LADEN
   ========================================= */

function loadWeather() {

    var url =

    "https://api.open-meteo.com/v1/forecast" +

    "?latitude=50.7753" +

    "&longitude=6.0839" +

    "&current=" +
    "temperature_2m," +
    "apparent_temperature," +
    "weather_code," +
    "wind_speed_10m" +

    "&hourly=" +
    "precipitation_probability" +

    "&daily=" +
    "weather_code," +
    "temperature_2m_max," +
    "temperature_2m_min," +
    "precipitation_probability_max," +
    "sunrise," +
    "sunset" +

    "&timezone=Europe%2FBerlin" +

    "&forecast_days=5";


    fetch(url)

    .then(function(response) {

        if (!response.ok)
            throw new Error("HTTP");

        return response.json();
    })

    .then(function(data) {


        var current =
            weatherInfo(
                data.current.weather_code
            );


        document.getElementById(
            "currentIcon"
        ).innerHTML =
            current[0];


        document.getElementById(
            "condition"
        ).textContent =
            current[1];


        document.getElementById(
            "temperature"
        ).textContent =
            Math.round(
                data.current.temperature_2m
            );


        document.getElementById(
            "feels"
        ).textContent =
            Math.round(
                data.current.apparent_temperature
            );


        var wind =
            Math.round(
                data.current.wind_speed_10m
            );


        document.getElementById(
            "wind"
        ).textContent =
            wind;


        document.getElementById(
            "wind2"
        ).textContent =
            wind + " km/h";


        document.getElementById(
            "max"
        ).textContent =
            Math.round(
                data.daily.temperature_2m_max[0]
            );


        document.getElementById(
            "min"
        ).textContent =
            Math.round(
                data.daily.temperature_2m_min[0]
            );


        document.getElementById(
            "rain"
        ).textContent =
            data.daily
                .precipitation_probability_max[0];


        /*
           SONNENAUFGANG / UNTERGANG
        */

        document.getElementById(
            "sunrise"
        ).textContent =
            shortTime(
                data.daily.sunrise[0]
            );


        document.getElementById(
            "sunset"
        ).textContent =
            shortTime(
                data.daily.sunset[0]
            );


        /*
           REGENVERLAUF
        */

        buildRainTimeline(data);


        /*
           VORHERSAGE
        */

        var forecast =
            document.getElementById(
                "forecast"
            );

        forecast.innerHTML = "";


        for (
            var i=1;
            i<5;
            i++
        ) {

            var weather =
                weatherInfo(
                    data.daily.weather_code[i]
                );


            forecast.innerHTML +=

            '<div class="forecast-day">' +

                '<div class="forecast-name">' +
                shortDay(
                    data.daily.time[i]
                ) +
                '</div>' +

                '<div class="forecast-icon">' +
                weather[0] +
                '</div>' +

                '<div class="forecast-max">' +
                Math.round(
                    data.daily.temperature_2m_max[i]
                ) +
                '°</div>' +

                '<div class="forecast-min">' +
                Math.round(
                    data.daily.temperature_2m_min[i]
                ) +
                '° min</div>' +

                '<div class="forecast-rain">' +
                data.daily
                    .precipitation_probability_max[i] +
                '% Regen</div>' +

            '</div>';
        }


        document.getElementById(
            "updated"
        ).textContent =

        "Aktualisiert " +

        new Date()
            .toLocaleTimeString(
                "de-DE",
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            );

    })


    .catch(function(error) {

        document.getElementById(
            "condition"
        ).textContent =
            "Wetter nicht verfügbar";

        console.log(error);

    });
}


loadWeather();

setInterval(
    loadWeather,
    900000
);

function displayEvents(events) {

    var list =
        document.getElementById(
            "eventList"
        );

    list.innerHTML = "";


    if (
        !events ||
        events.length === 0
    ) {

        list.innerHTML =
            '<div class="event-placeholder">' +
            'Keine kommenden Termine' +
            '</div>';

        return;
    }


    for (
        var i=0;
        i<Math.min(events.length,4);
        i++
    ) {

        list.innerHTML +=

        '<div class="event">' +

            '<div class="event-time">' +
            events[i].time +
            '</div>' +

            '<div class="event-name">' +
            events[i].title +
            '</div>' +

        '</div>';
    }
}

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #0e1012;
    color: #f2f2ef;
    overflow: hidden;
}

.dashboard {
    width: 100vw;
    height: 100vh;
    padding: 34px 48px;
    display: grid;
    grid-template-columns: 48% 52%;
    gap: 45px;
}

/* ---------- LINKS ---------- */

.left {
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.topline {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.location,
.section-title {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #bfc3c6;
}

.time {
    font-size: 112px;
    line-height: .95;
    letter-spacing: -6px;
    font-weight: 700;
    margin-top: 18px;
    color: #fff;
}

.date {
    font-size: 24px;
    margin-top: 10px;
    color: #d2d5d6;
}

/* ---------- MONATSKALENDER ---------- */

.calendar-box {
    margin-top: 25px;
    border-top: 1px solid #35393d;
    padding-top: 18px;
}

.calendar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 11px;
}

.month-name {
    font-size: 17px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
}

.calendar-year {
    font-size: 15px;
    color: #747a7e;
}

.calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    gap: 3px 5px;
}

.weekday {
    font-size: 11px;
    color: #686e72;
    font-weight: 700;
    padding-bottom: 4px;
}

.calendar-day {
    height: 25px;
    line-height: 25px;
    font-size: 14px;
    color: #c7cacc;
}

.calendar-day.other {
    color: #41464a;
}

.calendar-day.today {
    background: #f0f0ed;
    color: #101214;
    width: 25px;
    height: 25px;
    line-height: 25px;
    border-radius: 50%;
    margin: auto;
    font-weight: 700;
}

/* ---------- TERMINE ---------- */

.events {
    margin-top: 20px;
    border-top: 1px solid #35393d;
    padding-top: 16px;
}

.events-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.events-source {
    font-size: 11px;
    color: #5f6569;
}

.event-list {
    margin-top: 10px;
}

.event {
    display: grid;
    grid-template-columns: 72px 1fr;
    min-height: 31px;
    align-items: center;
    border-bottom: 1px solid #202428;
}

.event-time {
    font-size: 13px;
    color: #858b8f;
}

.event-name {
    font-size: 15px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.event-placeholder {
    padding: 13px 0;
    color: #62686c;
    font-size: 14px;
}

/* ---------- RECHTS ---------- */

.right {
    border-left: 1px solid #3c4145;
    padding-left: 45px;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.weather-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.weather-location {
    font-size: 12px;
    color: #62686c;
    letter-spacing: 1px;
}

/* ---------- JETZT ---------- */

.current-weather {
    padding: 28px 0 25px;
    display: grid;
    grid-template-columns: 120px 1fr;
    align-items: center;
    border-bottom: 1px solid #35393d;
}

.current-icon {
    width: 92px;
    height: 92px;
}

.current-temp {
    font-size: 83px;
    line-height: .9;
    font-weight: 700;
}

.current-condition {
    font-size: 21px;
    margin-top: 10px;
}

.current-sub {
    font-size: 14px;
    color: #7f8589;
    margin-top: 7px;
}

/* ---------- HEUTE ---------- */

.weather-details {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    padding: 22px 0;
    border-bottom: 1px solid #35393d;
}

.detail {
    text-align: center;
}

.detail-label {
    font-size: 11px;
    color: #6f7579;
    margin-bottom: 7px;
    text-transform: uppercase;
    letter-spacing: .7px;
}

.detail-value {
    font-size: 22px;
    font-weight: 700;
}

/* ---------- VORHERSAGE ---------- */

.forecast-title {
    margin-top: 24px;
}

.forecast {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 7px;
    align-items: center;
}

.forecast-day {
    text-align: center;
}

.forecast-name {
    font-size: 15px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.forecast-icon {
    width: 55px;
    height: 55px;
    margin: 14px auto;
}

.forecast-max {
    font-size: 23px;
    font-weight: 700;
}

.forecast-min {
    color: #73797d;
    font-size: 14px;
    margin-top: 3px;
}

.forecast-rain {
    color: #969b9e;
    font-size: 12px;
    margin-top: 9px;
}

.updated {
    text-align: right;
    color: #474c50;
    font-size: 10px;
}

/* ---------- MONOCHROME WEATHER ICONS ---------- */

.weather-svg {
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #e5e7e7;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.weather-svg .muted {
    stroke: #7d8387;
}

.weather-svg .rain {
    stroke: #aeb3b5;
}

@media(max-width:1000px) {
    .dashboard {
        padding: 25px 30px;
        gap: 28px;
    }

    .time { font-size: 92px; }
    .right { padding-left: 28px; }
    .current-temp { font-size: 70px; }
}
</style>
</head>

<body>

<div class="dashboard">

<!-- LINKS -->

<section class="left">

    <div class="topline">
        <div class="location">Aachen</div>
    </div>

    <div id="time" class="time">--:--</div>
    <div id="date" class="date">...</div>

    <div class="calendar-box">

        <div class="calendar-header">
            <div id="monthName" class="month-name"></div>
            <div id="calendarYear" class="calendar-year"></div>
        </div>

        <div id="calendar" class="calendar-grid"></div>

    </div>

    <div class="events">

        <div class="events-title">
            <div class="section-title">Nächste Termine</div>
            <div class="events-source">iCloud + Google</div>
        </div>

        <div id="eventList" class="event-list">

            <div class="event-placeholder">
                Kalender noch nicht verbunden
            </div>

        </div>

    </div>

</section>


<!-- RECHTS -->

<section class="right">

    <div class="weather-heading">

        <div class="section-title">
            Wetter
        </div>

        <div class="weather-location">
            Aachen
        </div>

    </div>


    <div class="current-weather">

        <div id="currentIcon" class="current-icon"></div>

        <div>

            <div class="current-temp">
                <span id="temperature">--</span>°
            </div>

            <div id="condition" class="current-condition">
                Wetter wird geladen
            </div>

            <div class="current-sub">
                Gefühlt
                <span id="feels">--</span>°
                &nbsp;·&nbsp;
                Wind
                <span id="wind">--</span>
                km/h
            </div>

        </div>

    </div>


    <div class="weather-details">

        <div class="detail">
            <div class="detail-label">Maximum</div>
            <div class="detail-value"><span id="max">--</span>°</div>
        </div>

        <div class="detail">
            <div class="detail-label">Minimum</div>
            <div class="detail-value"><span id="min">--</span>°</div>
        </div>

        <div class="detail">
            <div class="detail-label">Regen</div>
            <div class="detail-value"><span id="rain">--</span>%</div>
        </div>

        <div class="detail">
            <div class="detail-label">Wind</div>
            <div class="detail-value"><span id="wind2">--</span></div>
        </div>

    </div>


    <div class="section-title forecast-title">
        Nächste Tage
    </div>

    <div id="forecast" class="forecast"></div>

    <div id="updated" class="updated"></div>

</section>

</div>


<script>

/* ==========================================
   UHR
   ========================================== */

function updateClock() {

    var now = new Date();

    document.getElementById("time").textContent =
        now.toLocaleTimeString(
            "de-DE",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );

    document.getElementById("date").textContent =
        now.toLocaleDateString(
            "de-DE",
            {
                weekday: "long",
                day: "numeric",
                month: "long",
                year: "numeric"
            }
        );
}

updateClock();
setInterval(updateClock,1000);


/* ==========================================
   MONATSKALENDER
   ========================================== */

function buildCalendar() {

    var today = new Date();

    var year = today.getFullYear();
    var month = today.getMonth();

    var monthNames = [
        "Januar",
        "Februar",
        "März",
        "April",
        "Mai",
        "Juni",
        "Juli",
        "August",
        "September",
        "Oktober",
        "November",
        "Dezember"
    ];

    document.getElementById("monthName").textContent =
        monthNames[month];

    document.getElementById("calendarYear").textContent =
        year;

    var calendar =
        document.getElementById("calendar");

    calendar.innerHTML = "";

    var weekdays =
        ["MO","DI","MI","DO","FR","SA","SO"];

    for (var w = 0; w < weekdays.length; w++) {

        calendar.innerHTML +=
            '<div class="weekday">' +
            weekdays[w] +
            '</div>';
    }

    var firstDay =
        new Date(year,month,1);

    var start =
        firstDay.getDay();

    if (start === 0)
        start = 7;

    start--;

    var days =
        new Date(
            year,
            month + 1,
            0
        ).getDate();

    var previousDays =
        new Date(
            year,
            month,
            0
        ).getDate();

    for (var p = start - 1; p >= 0; p--) {

        calendar.innerHTML +=
            '<div class="calendar-day other">' +
            (previousDays - p) +
            '</div>';
    }

    for (var d = 1; d <= days; d++) {

        var css =
            "calendar-day";

        if (d === today.getDate())
            css += " today";

        calendar.innerHTML +=
            '<div class="' +
            css +
            '">' +
            d +
            '</div>';
    }

    var cells =
        start + days;

    var remainder =
        cells % 7;

    if (remainder !== 0) {

        var next =
            7 - remainder;

        for (var n = 1; n <= next; n++) {

            calendar.innerHTML +=
                '<div class="calendar-day other">' +
                n +
                '</div>';
        }
    }
}

buildCalendar();


/* ==========================================
   MONOCHROME WETTERICONS
   ========================================== */

function sunSVG() {

return `
<svg class="weather-svg" viewBox="0 0 100 100">

<circle cx="50" cy="50" r="17"/>

<path d="
M50 10v12
M50 78v12
M10 50h12
M78 50h12
M22 22l9 9
M69 69l9 9
M78 22l-9 9
M31 69l-9 9
"/>

</svg>`;
}


function cloudSVG() {

return `
<svg class="weather-svg" viewBox="0 0 100 100">

<path d="
M27 69
h45
c11 0 18-7 18-17
s-8-17-18-17
c-4-13-14-20-27-20
-15 0-27 11-29 25
C7 42 3 49 3 57
c0 7 6 12 14 12
z
"/>

</svg>`;
}


function partlyCloudySVG() {

return `
<svg class="weather-svg" viewBox="0 0 100 100">

<circle
class="muted"
cx="35"
cy="34"
r="15"
/>

<path
class="muted"
d="
M35 7v9
M35 52v8
M8 34h9
M53 34h9
M16 15l7 7
M48 47l7 7
M55 15l-7 7
"
/>

<path d="
M29 75
h45
c10 0 17-7 17-16
s-7-16-17-16
c-4-11-13-17-24-17
-14 0-24 9-27 21
-9 1-15 7-15 15
0 7 6 13 14 13
z
"/>

</svg>`;
}


function rainSVG() {

return `
<svg class="weather-svg" viewBox="0 0 100 100">

<path d="
M27 57
h45
c10 0 17-7 17-16
s-7-16-17-16
c-4-11-13-17-24-17
-14 0-24 9-27 21
-9 1-15 7-15 15
0 7 6 13 14 13
z
"/>

<path class="rain" d="
M29 70l-5 10
M49 70l-5 10
M69 70l-5 10
"/>

</svg>`;
}


function stormSVG() {

return `
<svg class="weather-svg" viewBox="0 0 100 100">

<path d="
M27 55
h45
c10 0 17-7 17-16
s-7-16-17-16
c-4-11-13-17-24-17
-14 0-24 9-27 21
-9 1-15 7-15 15
0 7 6 13 14 13
z
"/>

<path d="
M53 61
L41 79
h11
l-6 14
20-22
H55
z
"/>

</svg>`;
}


function snowSVG() {

return `
<svg class="weather-svg" viewBox="0 0 100 100">

<path d="
M27 53
h45
c10 0 17-7 17-16
s-7-16-17-16
c-4-11-13-17-24-17
-14 0-24 9-27 21
-9 1-15 7-15 15
0 7 6 13 14 13
z
"/>

<circle cx="30" cy="72" r="2"/>
<circle cx="50" cy="78" r="2"/>
<circle cx="70" cy="72" r="2"/>

</svg>`;
}


function fogSVG() {

return `
<svg class="weather-svg" viewBox="0 0 100 100">

<path d="M17 35h66"/>
<path d="M10 50h80"/>
<path d="M18 65h64"/>

</svg>`;
}


function weatherInfo(code) {

    if (code === 0)
        return [sunSVG(),"Klar"];

    if (code === 1)
        return [partlyCloudySVG(),"Überwiegend klar"];

    if (code === 2)
        return [partlyCloudySVG(),"Teilweise bewölkt"];

    if (code === 3)
        return [cloudSVG(),"Bewölkt"];

    if (code === 45 || code === 48)
        return [fogSVG(),"Nebel"];

    if ([51,53,55,56,57].indexOf(code) !== -1)
        return [rainSVG(),"Nieselregen"];

    if ([61,63,65,66,67,80,81,82].indexOf(code) !== -1)
        return [rainSVG(),"Regen"];

    if ([71,73,75,77,85,86].indexOf(code) !== -1)
        return [snowSVG(),"Schnee"];

    if ([95,96,99].indexOf(code) !== -1)
        return [stormSVG(),"Gewitter"];

    return [cloudSVG(),"Wetter"];
}


/* ==========================================
   WETTER
   ========================================== */

function shortDay(dateString) {

    var date =
        new Date(dateString + "T12:00:00");

    return date.toLocaleDateString(
        "de-DE",
        {weekday:"short"}
    );
}


function loadWeather() {

    var url =

    "https://api.open-meteo.com/v1/forecast" +

    "?latitude=50.7753" +
    "&longitude=6.0839" +

    "&current=" +
    "temperature_2m," +
    "apparent_temperature," +
    "weather_code," +
    "wind_speed_10m" +

    "&daily=" +
    "weather_code," +
    "temperature_2m_max," +
    "temperature_2m_min," +
    "precipitation_probability_max" +

    "&timezone=Europe%2FBerlin" +

    "&forecast_days=5";


    fetch(url)

    .then(function(response) {

        if (!response.ok)
            throw new Error("HTTP");

        return response.json();
    })

    .then(function(data) {

        var current =
            weatherInfo(
                data.current.weather_code
            );

        document.getElementById("currentIcon").innerHTML =
            current[0];

        document.getElementById("condition").textContent =
            current[1];

        document.getElementById("temperature").textContent =
            Math.round(data.current.temperature_2m);

        document.getElementById("feels").textContent =
            Math.round(data.current.apparent_temperature);

        var wind =
            Math.round(data.current.wind_speed_10m);

        document.getElementById("wind").textContent =
            wind;

        document.getElementById("wind2").textContent =
            wind + " km/h";

        document.getElementById("max").textContent =
            Math.round(data.daily.temperature_2m_max[0]);

        document.getElementById("min").textContent =
            Math.round(data.daily.temperature_2m_min[0]);

        document.getElementById("rain").textContent =
            data.daily.precipitation_probability_max[0];


        var forecast =
            document.getElementById("forecast");

        forecast.innerHTML = "";


        for (var i = 1; i < 5; i++) {

            var weather =
                weatherInfo(
                    data.daily.weather_code[i]
                );

            forecast.innerHTML +=

            '<div class="forecast-day">' +

                '<div class="forecast-name">' +
                shortDay(data.daily.time[i]) +
                '</div>' +

                '<div class="forecast-icon">' +
                weather[0] +
                '</div>' +

                '<div class="forecast-max">' +
                Math.round(
                    data.daily.temperature_2m_max[i]
                ) +
                '°</div>' +

                '<div class="forecast-min">' +
                Math.round(
                    data.daily.temperature_2m_min[i]
                ) +
                '° min</div>' +

                '<div class="forecast-rain">' +
                data.daily.precipitation_probability_max[i] +
                '% Regen</div>' +

            '</div>';
        }


        document.getElementById("updated").textContent =

        "Aktualisiert " +

        new Date().toLocaleTimeString(
            "de-DE",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    })

    .catch(function() {

        document.getElementById("condition").textContent =
            "Wetter nicht verfügbar";

    });
}


loadWeather();

setInterval(
    loadWeather,
    900000
);


/* ==========================================
   KALENDER-SCHNITTSTELLE

   Noch absichtlich deaktiviert.

   Später werden hier zusammengeführt:

   1. Google Kalender
   2. iCloud Geburtstage

   KEINE privaten URLs oder Passwörter
   direkt in diese öffentliche Datei schreiben.
   ========================================== */

function displayEvents(events) {

    var list =
        document.getElementById("eventList");

    list.innerHTML = "";


    if (!events || events.length === 0) {

        list.innerHTML =
            '<div class="event-placeholder">' +
            'Keine kommenden Termine' +
            '</div>';

        return;
    }


    for (
        var i = 0;
        i < Math.min(events.length,4);
        i++
    ) {

        list.innerHTML +=

        '<div class="event">' +

            '<div class="event-time">' +
            events[i].time +
            '</div>' +

            '<div class="event-name">' +
            events[i].title +
            '</div>' +

        '</div>';
    }
}

</script>

</body>
</html>
